<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0f2d23">
    <meta name="description" content="Sancho revisa tus pull requests de Bitbucket y comenta los problemas que encuentra.">
    <title>Sancho · Revisión de pull requests</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>
      // Aplica el modo elegido (claro, oscuro o sistema) antes de pintar, para que no parpadee.
      try { const t = localStorage.getItem('sancho-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
