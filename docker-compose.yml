services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sancho}
      POSTGRES_USER: ${POSTGRES_USER:-sancho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes: ["sancho-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sancho} -d ${POSTGRES_DB:-sancho}"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sancho}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sancho}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SANCHO_ENCRYPTION_KEY: ${SANCHO_ENCRYPTION_KEY:?Define SANCHO_ENCRYPTION_KEY}
      PORT: 3000
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports: ["127.0.0.1:${SANCHO_PORT:-3000}:3000"]
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist-server/server.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sancho}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sancho}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SANCHO_ENCRYPTION_KEY: ${SANCHO_ENCRYPTION_KEY:?Define SANCHO_ENCRYPTION_KEY}
      PORT: 3001
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WORKER_ONLY: "true"
      RUN_WORKER: "true"
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-16000}
      AI_EXCHANGE_RETENTION_DAYS: ${AI_EXCHANGE_RETENTION_DAYS:-30}
    depends_on:
      db: {condition: service_healthy}
  caddy:
    image: caddy:2.9-alpine
    profiles: ["production"]
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Define CADDY_DOMAIN para HTTPS}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
volumes:
  sancho-data:
  caddy-data:
  caddy-config:
